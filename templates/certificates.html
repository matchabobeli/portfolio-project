{% extends 'base.html' %}
{% block title %}Certificates — Annisa Salsabila{% endblock %}

{% block content %}
<main class="pt-16 relative z-10 page-transition">
    <section class="max-w-5xl mx-auto px-6 py-16">
        <div class="mb-12 fade-in">
            <p class="text-[#ffb6d5] text-xs font-medium tracking-widest uppercase mb-2">— Achievements</p>
            <h1 class="text-4xl font-bold text-white mb-4">Certificates</h1>
            <p class="text-gray-400 text-sm max-w-lg">A collection of certifications and achievements throughout my
                academic
                and professional journey.</p>
        </div>
        <div id="cert-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>

    <!-- Lightbox -->
    <div id="lightbox" class="fixed inset-0 bg-black/90 z-50 hidden items-center justify-center p-8"
        onclick="closeLightbox()">
        <img id="lightbox-img" src="" class="max-w-3xl max-h-[85vh] rounded-xl object-contain">
    </div>

    <script>
        async function loadCertificates() {
            const res = await fetch('/api/certificates/');
            const certs = await res.json();
            const div = document.getElementById('cert-list');

            if (certs.length === 0) {
                div.innerHTML = '<p class="text-gray-500 col-span-3 text-center">No certificates yet.</p>';
                return;
            }

            div.innerHTML = certs.map((c, i) => `
        <div class="bg-[#0d1225] border border-[#1e2a4a] rounded-xl overflow-hidden card-hover fade-in cursor-pointer"
             style="transition-delay: ${i * 0.1}s"
             onclick="${c.image ? `openLightbox('${c.image}')` : ''}">
            ${c.image
                    ? `<img src="${c.image}" class="w-full h-48 object-cover">`
                    : `<div class="w-full h-48 bg-[#1e2a4a] flex items-center justify-center"><i class="fas fa-certificate text-4xl text-[#ffb6d5]/30"></i></div>`
                }
            <div class="p-5">
                <h3 class="font-semibold text-white mb-1 text-sm">${c.name}</h3>
                <p class="text-[#ffb6d5] text-xs mb-2">${c.issuer}</p>
                <p class="text-gray-500 text-xs">${c.date}</p>
                ${c.url ? `<a href="${c.url}" target="_blank" class="text-xs text-[#7a9cc5] hover:text-[#ffb6d5] mt-2 inline-block" onclick="event.stopPropagation()">View credential →</a>` : ''}
            </div>
        </div>
    `).join('');

            setTimeout(() => document.querySelectorAll('.fade-in').forEach(el => el.classList.add('visible')), 100);
        }

        function openLightbox(imgUrl) {
            document.getElementById('lightbox-img').src = imgUrl;
            const lb = document.getElementById('lightbox');
            lb.classList.remove('hidden');
            lb.classList.add('flex');
        }

        function closeLightbox() {
            const lb = document.getElementById('lightbox');
            lb.classList.add('hidden');
            lb.classList.remove('flex');
        }

        loadCertificates();
    </script>
</main>
{% endblock %}
