{% extends 'base.html' %}
{% block title %}Skills — Annisa Salsabila{% endblock %}

{% block content %}
<section class="max-w-5xl mx-auto px-6 py-8 page-transition">
    <div class="mb-12 fade-in">
        <p class="text-[#ffb6d5] text-xs font-medium tracking-widest uppercase mb-2">— What I Bring</p>
        <h1 class="text-4xl font-bold text-white mb-4">Skills</h1>
    </div>

    <div class="grid md:grid-cols-2 gap-12">
        <div class="fade-in">
            <h2 class="text-xs font-medium text-gray-500 uppercase tracking-widest mb-6 flex items-center gap-2">
                <span class="w-6 h-px bg-[#ffb6d5]"></span> Hard Skills
            </h2>
            <div class="space-y-3" id="hard-skills"></div>
        </div>
        <div class="fade-in" style="transition-delay: 0.15s">
            <h2 class="text-xs font-medium text-gray-500 uppercase tracking-widest mb-6 flex items-center gap-2">
                <span class="w-6 h-px bg-[#7a9cc5]"></span> Soft Skills
            </h2>
            <div class="space-y-3" id="soft-skills"></div>
        </div>
    </div>
</section>

<script>
    const hardSkills = [
        "Event Coordination & Field Execution",
        "Stakeholder & Sponsor Management",
        "Media Partner & External Communication",
        "Administrative Support & Data Entry",
        "Microsoft Word & Excel",
        "Canva — Event Content & Poster Design",
        "CapCut — Basic Video Editing",
    ];

    const softSkills = [
        "Communication & Interpersonal Skills",
        "Team Coordination & Leadership",
        "Adaptability & Quick Decision Making",
        "Time Management & Multitasking",
        "Attention to Detail",
        "Problem Solving",
    ];

    const starIcon = `<svg width="14" height="14" viewBox="0 0 50 50" fill="none">
    <path d="M25 2C25 2 27 18 25 25C23 32 25 48 25 48C25 48 23 32 25 25C27 18 25 2 25 2Z" fill="#ffb6d5"/>
    <path d="M2 25C2 25 18 23 25 25C32 27 48 25 48 25C48 25 32 27 25 25C18 23 2 25 2 25Z" fill="#ffb6d5"/>
</svg>`;

    const blueStarIcon = `<svg width="14" height="14" viewBox="0 0 50 50" fill="none">
    <path d="M25 2C25 2 27 18 25 25C23 32 25 48 25 48C25 48 23 32 25 25C27 18 25 2 25 2Z" fill="#7a9cc5"/>
    <path d="M2 25C2 25 18 23 25 25C32 27 48 25 48 25C48 25 32 27 25 25C18 23 2 25 2 25Z" fill="#7a9cc5"/>
</svg>`;

    document.getElementById('hard-skills').innerHTML = hardSkills.map((s, i) => `
    <div class="flex items-center gap-3 bg-[#0d1225] border border-[#1e2a4a] rounded-xl px-5 py-3.5 card-hover fade-in" style="transition-delay:${i * 0.05}s">
        <span class="flex-shrink-0">${starIcon}</span>
        <span class="text-sm text-gray-300">${s}</span>
    </div>
`).join('');

    document.getElementById('soft-skills').innerHTML = softSkills.map((s, i) => `
    <div class="flex items-center gap-3 bg-[#0d1225] border border-[#1e2a4a] rounded-xl px-5 py-3.5 card-hover fade-in" style="transition-delay:${i * 0.05}s">
        <span class="flex-shrink-0">${blueStarIcon}</span>
        <span class="text-sm text-gray-300">${s}</span>
    </div>
`).join('');

    setTimeout(() => document.querySelectorAll('.fade-in').forEach(el => el.classList.add('visible')), 100);
</script>
{% endblock %}
