<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Annisa Salsabila{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700&display=swap');

        * {
            font-family: 'Inter', sans-serif;
        }

        .nav-blur {
            backdrop-filter: blur(16px);
        }

        .glow-pink {
            text-shadow: 0 0 40px rgba(255, 182, 213, 0.4);
        }

        .glow-border {
            box-shadow: 0 0 30px rgba(255, 182, 213, 0.1);
        }

        .fade-in {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .card-hover {
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .card-hover:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 182, 213, 0.25);
            box-shadow: 0 12px 40px rgba(255, 182, 213, 0.07);
        }

        .star-4 {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            animation: floatStar 6s ease-in-out infinite;
        }

        @keyframes floatStar {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.15;
            }

            50% {
                transform: translateY(-18px) rotate(15deg);
                opacity: 0.35;
            }
        }

        @keyframes floatStarR {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.1;
            }

            50% {
                transform: translateY(14px) rotate(-12deg);
                opacity: 0.25;
            }
        }

        ::-webkit-scrollbar {
            width: 3px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0e1a;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(#ffb6d5, #7a9cc5);
            border-radius: 2px;
        }

        .nav-name {
            font-family: 'Playfair Display', serif;
            letter-spacing: -0.5px;
        }

        .nav-link {
            position: relative;
            transition: color 0.2s ease;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 0;
            height: 1px;
            background: #ffb6d5;
            transition: width 0.3s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .nav-link:hover {
            color: white;
        }

        .nav-link.active {
            color: #ffb6d5;
        }

        .nav-link.active::after {
            width: 100%;
        }

        .nav-contact.active {
            background: rgba(255, 182, 213, 0.15);
            border-color: rgba(255, 182, 213, 0.5);
            color: #ffb6d5;
        }

        /* Animated gradient background */
        .bg-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: glowMove 8s ease-in-out infinite;
        }

        @keyframes glowMove {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.12;
            }

            33% {
                transform: translate(30px, -20px) scale(1.1);
                opacity: 0.18;
            }

            66% {
                transform: translate(-20px, 15px) scale(0.95);
                opacity: 0.1;
            }
        }

        @keyframes glowMoveR {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.08;
            }

            33% {
                transform: translate(-25px, 20px) scale(1.05);
                opacity: 0.14;
            }

            66% {
                transform: translate(20px, -15px) scale(1.1);
                opacity: 0.1;
            }
        }

        .image-container {
            position: relative;
            background: linear-gradient(45deg, #ffb6d5, #4a6fa5);
            background-size: 400% 400%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .image-container img {
            position: relative;
            z-index: 2;
        }

        /* Floating Glow Orbs - Smooth Random Movement */
        .floating-glow {
            position: fixed;
            width: var(--size, 400px);
            height: var(--size, 400px);
            background: radial-gradient(circle at 30% 30%, var(--color) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.12;
            z-index: 0;
            pointer-events: none;

            /* Smooth floating path */
            animation: floatPath var(--speed, 20s) ease-in-out infinite;
            animation-delay: calc(var(--delay, 0s) * 1s);
        }

        /* Keyframe floating path - elliptical orbit */
        @keyframes floatPath {

            0%,
            100% {
                transform:
                    translateX(var(--x1, 0%)) translateY(var(--y1, 0%)) scale(1) rotate(0deg);
                opacity: 0.12;
            }

            25% {
                transform:
                    translateX(calc(var(--x1, 0%) * 0.5)) translateY(calc(var(--y1, 0%) * 0.3)) scale(1.1) rotate(90deg);
                opacity: 0.18;
            }

            50% {
                transform:
                    translateX(var(--x2, 20%)) translateY(var(--y2, -10%)) scale(0.95) rotate(180deg);
                opacity: 0.15;
            }

            75% {
                transform:
                    translateX(calc(var(--x2, 20%) * 0.7)) translateY(calc(var(--y2, -10%) * 0.6)) scale(1.05) rotate(270deg);
                opacity: 0.16;
            }
        }

        /* Responsive - smaller on mobile */
        @media (max-width: 768px) {
            .floating-glow {
                --size: 300px !important;
            }
        }

        html {
            scroll-behavior: smooth;
        }

        .page-transition {
            opacity: 0;
            transform: translateY(20px);
            animation: slideIn 0.4s forwards;
        }

        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body.page-leaving {
            opacity: 0;
            transition: 0.2s;
        }

        /* Loading bar */
        #page-loader {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            width: 0%;
            background: linear-gradient(90deg, #ffb6d5, #7a9cc5, #ffb6d5);
            background-size: 200% 100%;
            z-index: 9999;
            transition: width 0.3s ease;
            animation: loaderShimmer 1.2s linear infinite;
            box-shadow: 0 0 8px rgba(255, 182, 213, 0.6);
            opacity: 0;
        }

        #page-loader.loading {
            opacity: 1;
        }

        @keyframes loaderShimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }
    </style>
</head>

<body class="bg-[#0a0e1a] text-gray-200 overflow-x-hidden">

    <!-- Page loading bar -->
    <div id="page-loader"></div>

    <!-- Floating Glow Orbs - Smooth Random Movement -->
    <div class="floating-glow"
        style="--size:500px; --color:#ffb6d5; --speed:20s; --x1:10%; --y1:10%; --x2:30%; --y2:-20%; top:10%; left:10%;">
    </div>
    <div class="floating-glow"
        style="--size:600px; --color:#4a6fa5; --speed:25s; --x1:-25%; --y1:80%; --x2:20%; --y2:40%; bottom:10%; right:10%;">
    </div>
    <div class="floating-glow"
        style="--size:400px; --color:#ffb6d5; --speed:18s; --x1:50%; --y1:20%; --x2:80%; --y2:60%; top:20%; left:50%;">
    </div>
    <div class="floating-glow"
        style="--size:250px; --color:#7a9cc5; --speed:22s; --x1:-15%; --y1:30%; --x2:70%; --y2:10%; top:30%; left:-10%;">
    </div>

    <!-- Floating 4-point stars -->
    <svg class="star-4" style="top:12%;left:5%;width:32px;animation-delay:0s" viewBox="0 0 50 50" fill="none">
        <path d="M25 2 C25 2 27 18 25 25 C23 32 25 48 25 48 C25 48 23 32 25 25 C27 18 25 2 25 2Z" fill="#ffb6d5" />
        <path d="M2 25 C2 25 18 23 25 25 C32 27 48 25 48 25 C48 25 32 27 25 25 C18 23 2 25 2 25Z" fill="#ffb6d5" />
    </svg>
    <svg class="star-4" style="top:20%;right:8%;width:20px;animation-delay:1.5s;animation-name:floatStarR"
        viewBox="0 0 50 50" fill="none">
        <path d="M25 2 C25 2 27 18 25 25 C23 32 25 48 25 48 C25 48 23 32 25 25 C27 18 25 2 25 2Z" fill="#7a9cc5" />
        <path d="M2 25 C2 25 18 23 25 25 C32 27 48 25 48 25 C48 25 32 27 25 25 C18 23 2 25 2 25Z" fill="#7a9cc5" />
    </svg>
    <svg class="star-4" style="top:55%;left:3%;width:14px;animation-delay:2s" viewBox="0 0 50 50" fill="none">
        <path d="M25 2 C25 2 27 18 25 25 C23 32 25 48 25 48 C25 48 23 32 25 25 C27 18 25 2 25 2Z" fill="#ffb6d5" />
        <path d="M2 25 C2 25 18 23 25 25 C32 27 48 25 48 25 C48 25 32 27 25 25 C18 23 2 25 2 25Z" fill="#ffb6d5" />
    </svg>
    <svg class="star-4" style="top:70%;right:5%;width:24px;animation-delay:0.8s;animation-name:floatStarR"
        viewBox="0 0 50 50" fill="none">
        <path d="M25 2 C25 2 27 18 25 25 C23 32 25 48 25 48 C25 48 23 32 25 25 C27 18 25 2 25 2Z" fill="#ffb6d5" />
        <path d="M2 25 C2 25 18 23 25 25 C32 27 48 25 48 25 C48 25 32 27 25 25 C18 23 2 25 2 25Z" fill="#ffb6d5" />
    </svg>
    <svg class="star-4" style="top:40%;right:2%;width:10px;animation-delay:3s" viewBox="0 0 50 50" fill="none">
        <path d="M25 2 C25 2 27 18 25 25 C23 32 25 48 25 48 C25 48 23 32 25 25 C27 18 25 2 25 2Z" fill="#7a9cc5" />
        <path d="M2 25 C2 25 18 23 25 25 C32 27 48 25 48 25 C48 25 32 27 25 25 C18 23 2 25 2 25Z" fill="#7a9cc5" />
    </svg>
    <svg class="star-4" style="top:85%;left:15%;width:18px;animation-delay:1s;animation-name:floatStarR"
        viewBox="0 0 50 50" fill="none">
        <path d="M25 2 C25 2 27 18 25 25 C23 32 25 48 25 48 C25 48 23 32 25 25 C27 18 25 2 25 2Z" fill="#ffb6d5" />
        <path d="M2 25 C2 25 18 23 25 25 C32 27 48 25 48 25 C48 25 32 27 25 25 C18 23 2 25 2 25Z" fill="#ffb6d5" />
    </svg>



    <!-- Navbar -->
    <nav class="fixed top-0 w-full bg-[#0d1225]/75 nav-blur border-b border-white/5 z-50">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/" class="flex items-center gap-2 group smooth-link" data-path="/">
                <span
                    class="nav-name text-xl font-bold text-white group-hover:text-[#ffb6d5] transition-colors duration-300">
                    Annisa Salsabila
                </span>
                <svg width="8" height="8" viewBox="0 0 50 50"
                    class="mb-1 opacity-70 group-hover:opacity-100 transition">
                    <path d="M25 2C25 2 27 18 25 25C23 32 25 48 25 48C25 48 23 32 25 25C27 18 25 2 25 2Z"
                        fill="#ffb6d5" />
                    <path d="M2 25C2 25 18 23 25 25C32 27 48 25 48 25C48 25 32 27 25 25C18 23 2 25 2 25Z"
                        fill="#ffb6d5" />
                </svg>
            </a>
            <div class="hidden md:flex items-center gap-8">
                <a href="/" class="nav-link smooth-link text-gray-400 text-sm" data-path="/">Home</a>
                <a href="/experience/" class="nav-link smooth-link text-gray-400 text-sm"
                    data-path="/experience/">Experience</a>
                <a href="/education/" class="nav-link smooth-link text-gray-400 text-sm"
                    data-path="/education/">Education</a>
                <a href="/skills/" class="nav-link smooth-link text-gray-400 text-sm" data-path="/skills/">Skills</a>
                <a href="/certificates/" class="nav-link smooth-link text-gray-400 text-sm"
                    data-path="/certificates/">Certificates</a>
                <a href="/contact/"
                    class="nav-contact smooth-link text-sm px-5 py-2 rounded-lg text-[#ffb6d5] border border-[#ffb6d5]/25 hover:bg-[#ffb6d5]/10 transition-all duration-300"
                    data-path="/contact/">Contact</a>
            </div>
            <!-- Hamburger button (mobile) -->
            <button id="mobile-menu-btn" class="md:hidden flex flex-col gap-1.5 p-2 group" aria-label="Open menu">
                <span class="w-5 h-0.5 bg-gray-400 group-hover:bg-[#ffb6d5] transition-all duration-300 block"
                    id="hb1"></span>
                <span class="w-5 h-0.5 bg-gray-400 group-hover:bg-[#ffb6d5] transition-all duration-300 block"
                    id="hb2"></span>
                <span class="w-3 h-0.5 bg-gray-400 group-hover:bg-[#ffb6d5] transition-all duration-300 block"
                    id="hb3"></span>
            </button>
        </div>
        <!-- Mobile menu dropdown -->
        <div id="mobile-menu" class="md:hidden hidden border-t border-white/5 bg-[#0d1225]/95 nav-blur">
            <div class="max-w-5xl mx-auto px-6 py-4 flex flex-col gap-1">
                <a href="/" class="nav-link smooth-link text-gray-400 text-sm py-2.5 border-b border-white/5"
                    data-path="/">Home</a>
                <a href="/experience/" class="nav-link smooth-link text-gray-400 text-sm py-2.5 border-b border-white/5"
                    data-path="/experience/">Experience</a>
                <a href="/education/" class="nav-link smooth-link text-gray-400 text-sm py-2.5 border-b border-white/5"
                    data-path="/education/">Education</a>
                <a href="/skills/" class="nav-link smooth-link text-gray-400 text-sm py-2.5 border-b border-white/5"
                    data-path="/skills/">Skills</a>
                <a href="/certificates/"
                    class="nav-link smooth-link text-gray-400 text-sm py-2.5 border-b border-white/5"
                    data-path="/certificates/">Certificates</a>
                <a href="/contact/"
                    class="nav-contact smooth-link text-sm py-2.5 mt-1 text-center rounded-lg text-[#ffb6d5] border border-[#ffb6d5]/25"
                    data-path="/contact/">Contact</a>
            </div>
        </div>
    </nav>
    <script>
        // Mobile menu toggle
        const mobileBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const hb1 = document.getElementById('hb1');
        const hb2 = document.getElementById('hb2');
        const hb3 = document.getElementById('hb3');
        let menuOpen = false;
        mobileBtn.addEventListener('click', () => {
            menuOpen = !menuOpen;
            mobileMenu.classList.toggle('hidden', !menuOpen);
            // Animate to X
            if (menuOpen) {
                hb1.style.transform = 'translateY(8px) rotate(45deg)';
                hb2.style.opacity = '0';
                hb3.style.transform = 'translateY(-4px) rotate(-45deg)';
                hb3.style.width = '20px';
            } else {
                hb1.style.transform = '';
                hb2.style.opacity = '';
                hb3.style.transform = '';
                hb3.style.width = '';
            }
        });
    </script>

    <div class="pt-16 relative z-10">
        <main>
            {% block content %}{% endblock %}
        </main>

        <footer class="border-t border-white/5 py-5 relative z-10">
            <div class="max-w-5xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4">
                <span class="nav-name text-gray-600 text-sm">Annisa Salsabila</span>
                <span class="text-gray-700 text-xs">© 2026 — Built with Django & Tailwind CSS</span>
                <div class="flex gap-4">
                    <a href="mailto:annisa310308@gmail.com"
                        class="text-gray-600 hover:text-[#ffb6d5] transition text-sm"><i
                            class="fas fa-envelope"></i></a>
                    <a href="https://wa.me/6282272895540"
                        class="text-gray-600 hover:text-green-400 transition text-sm"><i
                            class="fab fa-whatsapp"></i></a>
                    <a href="https://instagram.com/_nisaslsa"
                        class="text-gray-600 hover:text-pink-400 transition text-sm"><i
                            class="fab fa-instagram"></i></a>
                </div>
            </div>
        </footer>
    </div>

    <script>
        // Active nav highlight
        const currentPath = window.location.pathname;
        document.querySelectorAll('[data-path]').forEach(link => {
            if (link.getAttribute('data-path') === currentPath) {
                link.classList.add('active');
            }
        });

        // Fade-in observer
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
        }, { threshold: 0.1 });
        document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
    </script>
    <script>
        // Page loading bar
        const loader = document.getElementById('page-loader');

        function startLoader() {
            loader.style.width = '0%';
            loader.classList.add('loading');
            // Animate to 80% quickly, then wait for page load
            setTimeout(() => loader.style.width = '30%', 50);
            setTimeout(() => loader.style.width = '60%', 200);
            setTimeout(() => loader.style.width = '80%', 400);
        }

        function finishLoader() {
            loader.style.width = '100%';
            setTimeout(() => {
                loader.style.opacity = '0';
                loader.style.transition = 'opacity 0.3s ease, width 0.3s ease';
            }, 200);
        }

        // Run finish on page load (coming back from navigation)
        window.addEventListener('pageshow', () => finishLoader());

        class SPARouter {
            constructor() {
                document.addEventListener('click', e => {
                    const a = e.target.closest('a[href^="/"]');
                    if (a && !a.href.includes('://')) {
                        e.preventDefault();
                        startLoader();
                        document.body.style.opacity = '0';
                        document.body.style.transition = 'opacity 0.15s ease';
                        setTimeout(() => location.href = a.href, 180);
                    }
                });
            }
        }
        new SPARouter();
    </script>
</body>

</html>
